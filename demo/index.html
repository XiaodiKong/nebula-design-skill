<!doctype html>
<html lang="zh-CN" data-theme="clarity">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风控对象关系 - Risk OS</title>
  <style>
    :root {
      color-scheme: light;
      --font-sans: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-display: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --primary: #246bfd;
      --primary-hover: #4a85ff;
      --primary-active: #1b55d9;
      --primary-subtle: #edf4ff;
      --text: #1d2129;
      --text-secondary: #4e5969;
      --text-muted: #86909c;
      --text-disabled: #c9cdd4;
      --page-bg: #f5f7fa;
      --surface: #ffffff;
      --surface-hover: #f7f8fa;
      --surface-elevated: #ffffff;
      --border: #e5e6eb;
      --border-strong: #c9cdd4;
      --on-primary: #ffffff;
      --success: #00a870;
      --success-subtle: #e8f7f1;
      --warning: #d97706;
      --warning-subtle: #fff7e8;
      --danger: #e5484d;
      --danger-subtle: #fff0f0;
      --purple: #6e5ff8;
      --purple-subtle: #f3f1ff;
      --sidebar-width: 224px;
      --sidebar-collapsed: 64px;
      --topbar-height: 56px;
      --radius-control: 6px;
      --radius-surface: 8px;
      --shadow-floating: 0 8px 24px rgb(29 33 41 / 10%);
      --focus-ring: 0 0 0 3px rgb(36 107 253 / 20%);
      --sidebar-bg: #172033;
      --sidebar-text: #cbd2df;
      --sidebar-muted: #8f9bb3;
      --sidebar-hover: rgb(255 255 255 / 7%);
      --sidebar-hover-text: #ffffff;
      --sidebar-active: #246bfd;
      --sidebar-active-text: #ffffff;
      --sidebar-border: rgb(255 255 255 / 8%);
      --avatar-bg: #596780;
      --graph-bg: #fbfcfe;
      --graph-grid: rgb(134 144 156 / 22%);
      --match-ring: 0 0 0 2px rgb(36 107 253 / 14%);
      --identity: #246bfd;
      --event: #c46b20;
      --decision: #00a870;
      --handling: #c6538c;
    }

    html[data-theme="cal"] {
      color-scheme: light;
      --font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-display: "Cal Sans", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --primary: #111111;
      --primary-hover: #242424;
      --primary-active: #000000;
      --primary-subtle: #f3f4f6;
      --text: #111111;
      --text-secondary: #374151;
      --text-muted: #6b7280;
      --text-disabled: #a1a1aa;
      --page-bg: #f8f9fa;
      --surface: #ffffff;
      --surface-hover: #f5f5f5;
      --surface-elevated: #ffffff;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --success: #10b981;
      --success-subtle: #ecfdf5;
      --warning: #d97706;
      --warning-subtle: #fffbeb;
      --danger: #ef4444;
      --danger-subtle: #fef2f2;
      --sidebar-bg: #ffffff;
      --sidebar-text: #374151;
      --sidebar-muted: #898989;
      --sidebar-hover: #f5f5f5;
      --sidebar-hover-text: #111111;
      --sidebar-active: #111111;
      --sidebar-active-text: #ffffff;
      --sidebar-border: #e5e7eb;
      --avatar-bg: #111111;
      --radius-control: 8px;
      --radius-surface: 12px;
      --shadow-floating: 0 8px 24px rgb(17 17 17 / 9%);
      --focus-ring: 0 0 0 3px rgb(17 17 17 / 16%);
      --graph-bg: #ffffff;
      --graph-grid: rgb(107 114 128 / 18%);
      --match-ring: 0 0 0 2px rgb(17 17 17 / 13%);
    }

    html[data-theme="notion"] {
      color-scheme: light;
      --font-sans: "Notion Sans", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-display: "Notion Sans", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --primary: #5645d4;
      --primary-hover: #6756df;
      --primary-active: #4534b3;
      --primary-subtle: #e6e0f5;
      --text: #37352f;
      --text-secondary: #5d5b54;
      --text-muted: #787671;
      --text-disabled: #a4a097;
      --page-bg: #f7f6f3;
      --surface: #ffffff;
      --surface-hover: #f0eeec;
      --surface-elevated: #ffffff;
      --border: #e5e3df;
      --border-strong: #c8c4be;
      --success: #1aae39;
      --success-subtle: #d9f3e1;
      --warning: #dd5b00;
      --warning-subtle: #ffe8d4;
      --danger: #e03131;
      --danger-subtle: #fde0ec;
      --sidebar-bg: #f7f6f3;
      --sidebar-text: #37352f;
      --sidebar-muted: #787671;
      --sidebar-hover: #ebe9e5;
      --sidebar-hover-text: #37352f;
      --sidebar-active: #e6e0f5;
      --sidebar-active-text: #3a2a99;
      --sidebar-border: #e5e3df;
      --avatar-bg: #5645d4;
      --radius-control: 8px;
      --radius-surface: 12px;
      --shadow-floating: 0 8px 24px rgb(55 53 47 / 10%);
      --focus-ring: 0 0 0 3px rgb(86 69 212 / 18%);
      --graph-bg: #fcfbf9;
      --graph-grid: rgb(120 118 113 / 18%);
      --match-ring: 0 0 0 2px rgb(86 69 212 / 15%);
      --identity: #4d73c8;
      --event: #bd6b32;
      --decision: #2a9d6f;
      --handling: #a84f7d;
    }

    html[data-theme="linear"] {
      color-scheme: dark;
      --font-sans: "Linear Text", "SF Pro Text", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-display: "Linear Display", "SF Pro Display", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --primary: #5e6ad2;
      --primary-hover: #828fff;
      --primary-active: #5e69d1;
      --primary-subtle: #1d2033;
      --text: #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-muted: #8a8f98;
      --text-disabled: #62666d;
      --page-bg: #010102;
      --surface: #0f1011;
      --surface-hover: #18191a;
      --surface-elevated: #141516;
      --border: #23252a;
      --border-strong: #34343a;
      --success: #46b568;
      --success-subtle: #122818;
      --warning: #d29922;
      --warning-subtle: #2b2212;
      --danger: #ef6268;
      --danger-subtle: #32181b;
      --sidebar-bg: #080809;
      --sidebar-text: #d0d6e0;
      --sidebar-muted: #62666d;
      --sidebar-hover: #141516;
      --sidebar-hover-text: #f7f8f8;
      --sidebar-active: #1d2033;
      --sidebar-active-text: #f7f8f8;
      --sidebar-border: #23252a;
      --avatar-bg: #5e6ad2;
      --radius-control: 6px;
      --radius-surface: 8px;
      --shadow-floating: 0 16px 40px rgb(0 0 0 / 42%);
      --focus-ring: 0 0 0 3px rgb(94 106 210 / 30%);
      --graph-bg: #080809;
      --graph-grid: rgb(98 102 109 / 28%);
      --match-ring: 0 0 0 2px rgb(94 106 210 / 28%);
      --identity: #7684e8;
      --event: #c88758;
      --decision: #55b486;
      --handling: #b46d94;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--page-bg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5715;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    select {
      outline: none;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      box-shadow: var(--focus-ring);
    }

    button {
      color: inherit;
    }

    svg {
      display: block;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .icon-sm {
      width: 16px;
      height: 16px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      z-index: 40;
      inset: 0 auto 0 0;
      display: flex;
      width: var(--sidebar-width);
      flex-direction: column;
      color: var(--sidebar-text);
      background: var(--sidebar-bg);
      transition: width 180ms ease, transform 180ms ease;
    }

    .brand {
      display: flex;
      height: var(--topbar-height);
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--sidebar-border);
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      color: var(--on-primary);
      background: var(--primary);
      border-radius: 7px;
    }

    .brand-mark .icon {
      width: 17px;
      height: 17px;
    }

    .brand-name {
      overflow: hidden;
      color: var(--sidebar-hover-text);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-group + .nav-group {
      margin-top: 18px;
    }

    .nav-group-title {
      height: 24px;
      padding: 0 10px;
      overflow: hidden;
      color: var(--sidebar-muted);
      font-size: 12px;
      line-height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-item {
      display: flex;
      width: 100%;
      height: 40px;
      align-items: center;
      gap: 10px;
      margin: 2px 0;
      padding: 0 10px;
      color: var(--sidebar-text);
      text-decoration: none;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-item:hover {
      color: var(--sidebar-hover-text);
      background: var(--sidebar-hover);
    }

    .nav-item.is-active {
      color: var(--sidebar-active-text);
      background: var(--sidebar-active);
    }

    .nav-item-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-footer {
      padding: 10px 8px;
      border-top: 1px solid var(--sidebar-border);
    }

    .shell {
      min-width: 0;
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      transition: margin-left 180ms ease;
    }

    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: flex;
      height: var(--topbar-height);
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-picker {
      display: inline-flex;
      height: 32px;
      align-items: center;
      gap: 6px;
      padding-left: 9px;
      color: var(--text-secondary);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
    }

    .theme-picker-label {
      font-size: 12px;
      white-space: nowrap;
    }

    .theme-select {
      height: 30px;
      padding: 0 24px 0 6px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: var(--radius-control);
      cursor: pointer;
    }

    .top-context {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .icon-button {
      display: inline-grid;
      width: 32px;
      height: 32px;
      padding: 0;
      place-items: center;
      color: var(--text-secondary);
      background: transparent;
      border: 0;
      border-radius: var(--radius-control);
      cursor: pointer;
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .notification-button {
      position: relative;
    }

    .notification-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      background: var(--danger);
      border: 1px solid var(--surface);
      border-radius: 50%;
    }

    .environment-badge {
      display: inline-flex;
      height: 26px;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      color: var(--success);
      background: var(--success-subtle);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .environment-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
    }

    .user-area {
      position: relative;
    }

    .user-trigger {
      display: flex;
      height: 40px;
      align-items: center;
      gap: 9px;
      padding: 0 6px;
      background: transparent;
      border: 0;
      border-radius: var(--radius-control);
      cursor: pointer;
    }

    .user-trigger:hover {
      background: var(--surface-hover);
    }

    .avatar {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      color: var(--on-primary);
      background: var(--avatar-bg);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 600;
    }

    .user-meta {
      min-width: 0;
      text-align: left;
    }

    .user-name,
    .user-role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
    }

    .user-role {
      color: var(--text-muted);
      font-size: 12px;
    }

    .user-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 8px);
      right: 0;
      width: 180px;
      padding: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-floating);
    }

    .user-menu[hidden] {
      display: none;
    }

    .user-menu button {
      display: flex;
      width: 100%;
      height: 36px;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: transparent;
      border: 0;
      border-radius: var(--radius-control);
      cursor: pointer;
    }

    .user-menu button:hover {
      background: var(--surface-hover);
    }

    .main {
      padding: 18px 24px 24px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .breadcrumb-current {
      color: var(--text-secondary);
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }

    .page-description {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .page-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      height: 32px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-control);
      cursor: pointer;
      white-space: nowrap;
    }

    .button:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .button-primary {
      color: var(--on-primary);
      background: var(--primary);
      border-color: var(--primary);
    }

    .button-primary:hover {
      color: var(--on-primary);
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .button-primary:active {
      background: var(--primary-active);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-surface);
    }

    .search-field {
      position: relative;
      width: min(320px, 34vw);
      min-width: 210px;
    }

    .search-field .icon {
      position: absolute;
      top: 8px;
      left: 10px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input,
    .select {
      height: 32px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-control);
    }

    .input:hover,
    .select:hover {
      border-color: var(--primary-hover);
    }

    .input:focus,
    .select:focus {
      border-color: var(--primary);
      box-shadow: var(--focus-ring);
    }

    .input {
      width: 100%;
      padding: 0 10px 0 34px;
    }

    .select {
      min-width: 128px;
      padding: 0 30px 0 10px;
    }

    .filter-info {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .workbench {
      display: grid;
      min-height: 610px;
      overflow: hidden;
      grid-template-columns: minmax(0, 1fr) 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-surface);
    }

    .canvas-pane {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .canvas-toolbar {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .legend,
    .canvas-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .legend {
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      background: var(--legend-color);
      border-radius: 50%;
    }

    .legend-line {
      width: 20px;
      height: 0;
      border-top: 1.5px solid var(--text-muted);
    }

    .legend-line.is-dashed {
      border-top-style: dashed;
    }

    .control-group {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
    }

    .control-group .icon-button {
      border-radius: 0;
    }

    .control-group .icon-button + .icon-button {
      border-left: 1px solid var(--border);
    }

    .control-group .icon-button:first-child {
      border-radius: 5px 0 0 5px;
    }

    .control-group .icon-button:last-child {
      border-radius: 0 5px 5px 0;
    }

    .zoom-value {
      min-width: 40px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    .graph-viewport {
      position: relative;
      flex: 1;
      min-height: 548px;
      overflow: hidden;
      background-color: var(--graph-bg);
      background-image: radial-gradient(circle, var(--graph-grid) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .graph-surface {
      position: absolute;
      inset: 0;
      min-width: 760px;
      min-height: 548px;
      transform-origin: center;
      transition: transform 160ms ease;
    }

    .graph-edges,
    .graph-nodes,
    .graph-lanes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .graph-edges {
      overflow: visible;
      pointer-events: none;
    }

    .graph-edge {
      fill: none;
      stroke: var(--text-muted);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      transition: opacity 160ms ease, stroke 160ms ease;
    }

    .marker-neutral {
      fill: var(--text-muted);
    }

    .marker-active {
      fill: var(--primary);
    }

    .graph-edge[data-kind="data"] {
      stroke-dasharray: 5 4;
    }

    .graph-edge.is-active {
      stroke: var(--primary);
      stroke-width: 2;
    }

    .graph-edge.is-dimmed {
      opacity: 0.12;
    }

    .graph-edge.is-filtered {
      opacity: 0;
    }

    .edge-label {
      fill: var(--text);
      stroke: var(--graph-bg);
      stroke-width: 5;
      paint-order: stroke;
      text-anchor: middle;
      opacity: 0;
      pointer-events: none;
    }

    .edge-label.is-active {
      opacity: 1;
    }

    .lane-label {
      position: absolute;
      z-index: 1;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      transform: translateX(-50%);
    }

    .graph-node {
      position: absolute;
      z-index: 2;
      width: 138px;
      min-height: 54px;
      padding: 7px 10px 8px;
      color: var(--text);
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--node-color);
      border-radius: var(--radius-control);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition:
        opacity 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .graph-node:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      border-left-color: var(--node-color);
    }

    .graph-node[aria-pressed="true"] {
      background: var(--primary-subtle);
      border-color: var(--primary);
      border-left-color: var(--primary);
      box-shadow: var(--focus-ring);
    }

    .graph-node.is-related {
      transform: translate(-50%, -50%) scale(1.02);
    }

    .graph-node.is-dimmed,
    .graph-node.is-filtered {
      opacity: 0.18;
    }

    .graph-node.is-match {
      border-color: var(--primary);
      box-shadow: var(--match-ring);
    }

    .node-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-status {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      background: var(--status-color);
      border-radius: 50%;
    }

    .node-title {
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-meta {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .details-panel {
      min-width: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }

    .details-header {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .details-kicker {
      color: var(--text-muted);
      font-size: 12px;
    }

    .details-title {
      margin-top: 1px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
    }

    .details-body {
      padding: 14px 16px 18px;
    }

    .status-tag {
      display: inline-flex;
      height: 24px;
      align-items: center;
      padding: 0 8px;
      color: var(--tag-color);
      background: var(--tag-bg);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .summary-line {
      margin: 0 0 14px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .info-list {
      margin: 0;
    }

    .info-row {
      display: grid;
      gap: 12px;
      padding: 9px 0;
      grid-template-columns: 84px minmax(0, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .info-row dt {
      color: var(--text-muted);
    }

    .info-row dd {
      min-width: 0;
      margin: 0;
      color: var(--text);
      text-align: right;
      word-break: break-word;
    }

    .section-title {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .relation-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .relation-item {
      display: grid;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--surface-hover);
      border-radius: 6px;
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .relation-object {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .relation-label {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .overview-path {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .overview-path-node {
      padding: 4px 7px;
      color: var(--text-secondary);
      background: var(--surface-hover);
      border-radius: 4px;
      font-size: 12px;
    }

    .details-tip {
      margin-top: 16px;
      padding: 10px 12px;
      color: var(--text-secondary);
      background: var(--primary-subtle);
      border-radius: 6px;
      font-size: 13px;
    }

    .canvas-statusbar {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      color: var(--text-muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .statusbar-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toast {
      position: fixed;
      z-index: 100;
      right: 24px;
      bottom: 24px;
      display: flex;
      max-width: 360px;
      align-items: flex-start;
      gap: 9px;
      padding: 11px 14px;
      color: var(--text);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-floating);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast .icon {
      margin-top: 1px;
      color: var(--success);
    }

    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed);
    }

    body.sidebar-collapsed .shell {
      margin-left: var(--sidebar-collapsed);
    }

    body.sidebar-collapsed .brand {
      padding: 0 18px;
    }

    body.sidebar-collapsed .brand-name,
    body.sidebar-collapsed .nav-group-title,
    body.sidebar-collapsed .nav-item-label {
      display: none;
    }

    body.sidebar-collapsed .nav-item {
      justify-content: center;
      padding: 0;
    }

    @media (max-width: 1120px) {
      .theme-picker-label {
        display: none;
      }

      .theme-picker {
        padding-left: 0;
      }

      .workbench {
        grid-template-columns: minmax(0, 1fr);
      }

      .details-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
      }

      .details-body {
        display: grid;
        gap: 0 24px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .details-body > .summary-line,
      .details-body > .details-tip {
        grid-column: 1 / -1;
      }

      .legend-item:nth-last-child(-n + 2) {
        display: none;
      }
    }

    @media (max-width: 960px) {
      .graph-viewport,
      .graph-surface {
        min-height: 500px;
      }
    }

    @media (max-width: 760px) {
      .sidebar {
        width: var(--sidebar-width);
        box-shadow: var(--shadow-floating);
        transform: translateX(-100%);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-collapsed .sidebar {
        width: var(--sidebar-width);
      }

      body.sidebar-collapsed .brand-name,
      body.sidebar-collapsed .nav-group-title,
      body.sidebar-collapsed .nav-item-label {
        display: block;
      }

      body.sidebar-collapsed .nav-item {
        justify-content: flex-start;
        padding: 0 10px;
      }

      .shell,
      body.sidebar-collapsed .shell {
        margin-left: 0;
      }

      .main {
        padding: 16px;
      }

      .topbar {
        padding: 0 12px;
      }

      .top-context,
      .environment-badge,
      .user-meta {
        display: none;
      }

      .theme-select {
        max-width: 92px;
      }

      .page-header {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }

      .page-actions {
        justify-content: flex-end;
      }

      .filter-bar {
        align-items: stretch;
        flex-wrap: wrap;
      }

      .search-field {
        width: 100%;
        min-width: 0;
      }

      .select {
        flex: 1;
      }

      .filter-info {
        width: 100%;
        margin-left: 0;
      }

      .canvas-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .canvas-controls {
        width: 100%;
        justify-content: space-between;
      }

      .details-body {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

              <div class="statusbar-group">
                <span>数据更新时间：<time id="updatedAt">今天 14:32:18</time></span>
                <span>自动刷新：30 秒</span>
              </div>
            </div>
          </div>

          <aside class="details-panel" aria-label="对象详情">
            <div class="details-header">
              <div>
                <div class="details-kicker" id="detailsKicker">关系概览</div>
                <div class="details-title" id="detailsTitle">实时交易风控</div>
              </div>
              <span class="status-tag" id="detailsStatus" style="--tag-color:var(--primary);--tag-bg:var(--primary-subtle)">运行中</span>
            </div>
            <div class="details-body" id="detailsBody"></div>
          </aside>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="icon"><use href="#i-check"></use></svg>
    <span id="toastMessage"></span>
  </div>

  <script>
    (() => {
      const themeStorageKey = "risk-os-theme";
      const themeNames = {
        clarity: "Clarity",
        cal: "Cal.com",
        notion: "Notion",
        linear: "Linear"
      };
      const allowedThemes = new Set(Object.keys(themeNames));
      let initialTheme = document.documentElement.dataset.theme || "clarity";
      try {
        const savedTheme = window.localStorage.getItem(themeStorageKey);
        if (savedTheme && allowedThemes.has(savedTheme)) initialTheme = savedTheme;
      } catch {
        /* Local storage can be unavailable in privacy-restricted previews. */
      }
      document.documentElement.dataset.theme = initialTheme;

      const nodes = [
        { id: "customer", label: "客户主体", meta: "cust_291084", group: "identity", status: "关注", tone: "attention", owner: "客户中心", updated: "2 分钟前", description: "个人客户，近 30 日存在跨区域登录与高额交易。" },
        { id: "account", label: "账户", meta: "近 30 日活跃", group: "identity", status: "正常", tone: "normal", owner: "账户中心", updated: "1 分钟前", description: "主交易账户，当前状态正常。" },
        { id: "device", label: "设备指纹", meta: "命中共享设备", group: "identity", status: "可疑", tone: "attention", owner: "设备平台", updated: "刚刚", description: "该设备关联 6 个账户，超过常规关联阈值。" },
        { id: "ip", label: "IP 地址", meta: "异地登录", group: "identity", status: "可疑", tone: "attention", owner: "安全中心", updated: "3 分钟前", description: "登录地与常驻地相距 1,280 公里。" },
        { id: "bankcard", label: "银行卡", meta: "尾号 4821", group: "identity", status: "正常", tone: "normal", owner: "支付中心", updated: "12 分钟前", description: "实名银行卡，未命中失信或挂失名单。" },
        { id: "merchant", label: "商户", meta: "数字服务", group: "identity", status: "正常", tone: "normal", owner: "商户平台", updated: "6 分钟前", description: "数字服务类商户，近 7 日退款率正常。" },
        { id: "login", label: "登录事件", meta: "02:14 · 深圳", group: "event", status: "异常", tone: "attention", owner: "行为平台", updated: "3 分钟前", description: "非常用时段登录，且设备与 IP 均出现异常关联。" },
        { id: "transaction", label: "交易事件", meta: "¥ 18,600", group: "event", status: "高风险", tone: "danger", owner: "交易平台", updated: "刚刚", description: "夜间大额交易，金额显著高于客户近 30 日均值。" },
        { id: "feature", label: "实时风险特征", meta: "37 项", group: "decision", status: "已更新", tone: "normal", owner: "特征平台", updated: "刚刚", description: "聚合身份、设备、行为与历史交易特征。" },
        { id: "rules", label: "风控规则集", meta: "命中 3 条", group: "decision", status: "告警", tone: "attention", owner: "策略中心", updated: "刚刚", description: "命中异地登录、共享设备和夜间大额交易规则。" },
        { id: "model", label: "欺诈模型", meta: "风险分 87", group: "decision", status: "高风险", tone: "danger", owner: "模型平台", updated: "刚刚", description: "模型评分 87，超过人工审核阈值 72。" },
        { id: "decision", label: "决策结果", meta: "转人工审核", group: "decision", status: "待处置", tone: "attention", owner: "决策引擎", updated: "刚刚", description: "综合规则与模型结果，进入人工审核队列。" },
        { id: "manual", label: "人工审核", meta: "SLA 15 分钟", group: "handling", status: "处理中", tone: "attention", owner: "审核团队", updated: "1 分钟前", description: "审核员正在核实客户身份、设备和交易用途。" },
        { id: "case", label: "风险案件", meta: "CASE-260729", group: "handling", status: "调查中", tone: "attention", owner: "风险运营", updated: "1 分钟前", description: "由高风险交易自动创建，当前处于初步调查阶段。" },
        { id: "blacklist", label: "黑名单记录", meta: "待确认", group: "handling", status: "待生效", tone: "attention", owner: "名单中心", updated: "1 分钟前", description: "等待案件调查结论，确认后将反哺风控规则。" }
      ];

      const edges = [
        { source: "customer", target: "account", label: "持有", kind: "relation" },
        { source: "customer", target: "device", label: "使用", kind: "relation" },
        { source: "customer", target: "bankcard", label: "绑定", kind: "relation" },
        { source: "account", target: "transaction", label: "发起", kind: "relation" },
        { source: "device", target: "login", label: "触发", kind: "relation" },
        { source: "device", target: "transaction", label: "参与", kind: "relation" },
        { source: "ip", target: "login", label: "来源", kind: "relation" },
        { source: "bankcard", target: "transaction", label: "支付", kind: "relation" },
        { source: "merchant", target: "transaction", label: "收款", kind: "relation" },
        { source: "login", target: "feature", label: "行为输入", kind: "data" },
        { source: "transaction", target: "feature", label: "交易输入", kind: "data" },
        { source: "feature", target: "rules", label: "特征匹配", kind: "data" },
        { source: "feature", target: "model", label: "模型输入", kind: "data" },
        { source: "rules", target: "decision", label: "规则结果", kind: "relation" },
        { source: "model", target: "decision", label: "风险评分", kind: "relation" },
        { source: "decision", target: "manual", label: "转人工", kind: "relation" },
        { source: "decision", target: "case", label: "创建案件", kind: "relation" },
        { source: "manual", target: "case", label: "审核结论", kind: "relation" },
        { source: "case", target: "blacklist", label: "沉淀名单", kind: "relation" },
        { source: "blacklist", target: "rules", label: "名单反哺", kind: "data", route: "bottom" }
      ];

      const positions = {
        customer: [0.08, 0.18],
        account: [0.18, 0.32],
        device: [0.08, 0.48],
        ip: [0.18, 0.62],
        bankcard: [0.08, 0.78],
        merchant: [0.20, 0.86],
        login: [0.36, 0.36],
        transaction: [0.36, 0.68],
        feature: [0.57, 0.25],
        rules: [0.57, 0.47],
        model: [0.57, 0.70],
        decision: [0.73, 0.49],
        manual: [0.91, 0.30],
        case: [0.91, 0.56],
        blacklist: [0.91, 0.80]
      };

      const lanePositions = {
        identity: [0.12, 0.025],
        event: [0.36, 0.025],
        decision: [0.63, 0.025],
        handling: [0.91, 0.025]
      };

      const groupMeta = {
        identity: { label: "身份主体", color: "var(--identity)" },
        event: { label: "行为事件", color: "var(--event)" },
        decision: { label: "决策能力", color: "var(--decision)" },
        handling: { label: "处置闭环", color: "var(--handling)" }
      };

      const toneMeta = {
        normal: { color: "var(--success)", text: "var(--success)", background: "var(--success-subtle)" },
        attention: { color: "var(--warning)", text: "var(--warning)", background: "var(--warning-subtle)" },
        danger: { color: "var(--danger)", text: "var(--danger)", background: "var(--danger-subtle)" }
      };

      const byId = new Map(nodes.map((node) => [node.id, node]));
      const nodeElements = new Map();
      const body = document.body;
      const nodeLayer = document.getElementById("nodeLayer");
      const edgeLayer = document.getElementById("edgeLayer");
      const laneLayer = document.getElementById("laneLayer");
      const graphSurface = document.getElementById("graphSurface");
      const graphViewport = document.getElementById("graphViewport");
      const detailsKicker = document.getElementById("detailsKicker");
      const detailsTitle = document.getElementById("detailsTitle");
      const detailsStatus = document.getElementById("detailsStatus");
      const detailsBody = document.getElementById("detailsBody");
      const graphSearch = document.getElementById("graphSearch");
      const riskFilter = document.getElementById("riskFilter");
      const timeRange = document.getElementById("timeRange");
      const filterInfo = document.getElementById("filterInfo");
      const visibleCount = document.getElementById("visibleCount");
      const selectionStatus = document.getElementById("selectionStatus");
      const updatedAt = document.getElementById("updatedAt");
      const zoomValue = document.getElementById("zoomValue");
      const toast = document.getElementById("toast");
      const toastMessage = document.getElementById("toastMessage");
      const themeSwitcher = document.getElementById("themeSwitcher");
      const userTrigger = document.getElementById("userTrigger");
      const userMenu = document.getElementById("userMenu");
      const svgNamespace = "http://www.w3.org/2000/svg";

      let selectedId = null;
      let searchTerm = "";
      let filterValue = "all";
      let zoom = 1;
      let toastTimer = 0;
      let resizeFrame = 0;

      const icon = (id, className = "icon icon-sm") =>
        `<svg class="${className}" aria-hidden="true"><use href="#${id}"></use></svg>`;

      const showToast = (message) => {
        toastMessage.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
      };

      const formatNow = () => {
        const now = new Date();
        return `今天 ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
      };

      const relatedIds = (nodeId) => {
        const ids = new Set([nodeId]);
        edges.forEach((edge) => {
          if (edge.source === nodeId) ids.add(edge.target);
          if (edge.target === nodeId) ids.add(edge.source);
        });
        return ids;
      };

      const nodeMatchesFilter = (node) => {
        if (filterValue === "danger" && node.tone !== "danger") return false;
        if (filterValue === "attention" && node.tone !== "attention") return false;
        if (filterValue === "normal" && node.tone !== "normal") return false;
        if (!searchTerm) return true;
        const haystack = `${node.label} ${node.meta} ${node.owner}`.toLowerCase();
        return haystack.includes(searchTerm);
      };

      const renderNodes = () => {
        nodes.forEach((node) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "graph-node";
          button.dataset.node = node.id;
          button.style.setProperty("--node-color", groupMeta[node.group].color);
          button.style.setProperty("--status-color", toneMeta[node.tone].color);
          button.setAttribute("aria-pressed", "false");
          button.setAttribute("aria-label", `${node.label}，${node.meta}，状态${node.status}`);

          const titleRow = document.createElement("span");
          titleRow.className = "node-title-row";
          const status = document.createElement("span");
          status.className = "node-status";
          status.setAttribute("aria-hidden", "true");
          const title = document.createElement("span");
          title.className = "node-title";
          title.textContent = node.label;
          const meta = document.createElement("span");
          meta.className = "node-meta";
          meta.textContent = node.meta;

          titleRow.append(status, title);
          button.append(titleRow, meta);
          nodeLayer.append(button);
          nodeElements.set(node.id, button);

          button.addEventListener("click", () => {
            selectedId = selectedId === node.id ? null : node.id;
            updateView();
          });
        });
      };

      const renderLanes = () => {
        Object.entries(lanePositions).forEach(([groupId, [x, y]]) => {
          const label = document.createElement("span");
          label.className = "lane-label";
          label.textContent = groupMeta[groupId].label;
          label.style.left = `${x * 100}%`;
          label.style.top = `${y * 100}%`;
          laneLayer.append(label);
        });
      };

      const layoutNodes = () => {
        nodes.forEach((node) => {
          const [x, y] = positions[node.id];
          const element = nodeElements.get(node.id);
          element.style.left = `${x * 100}%`;
          element.style.top = `${y * 100}%`;
        });
        window.requestAnimationFrame(drawEdges);
      };

      const getAnchor = (fromId, toId) => {
        const fromRect = nodeElements.get(fromId).getBoundingClientRect();
        const toRect = nodeElements.get(toId).getBoundingClientRect();
        const surfaceRect = graphSurface.getBoundingClientRect();
        const centerX = fromRect.left - surfaceRect.left + fromRect.width / 2;
        const centerY = fromRect.top - surfaceRect.top + fromRect.height / 2;
        const targetX = toRect.left - surfaceRect.left + toRect.width / 2;
        const targetY = toRect.top - surfaceRect.top + toRect.height / 2;
        const dx = targetX - centerX;
        const dy = targetY - centerY;
        const distance = Math.hypot(dx, dy) || 1;
        const ux = dx / distance;
        const uy = dy / distance;
        const limitX = fromRect.width / 2 / Math.max(Math.abs(ux), 0.001);
        const limitY = fromRect.height / 2 / Math.max(Math.abs(uy), 0.001);
        const distanceToBorder = Math.min(limitX, limitY);
        return {
          x: centerX + ux * distanceToBorder,
          y: centerY + uy * distanceToBorder
        };
      };

      const drawEdges = () => {
        edgeLayer.replaceChildren();
        const surfaceRect = graphSurface.getBoundingClientRect();
        const activeEdges = selectedId
          ? new Set(edges.filter((edge) => edge.source === selectedId || edge.target === selectedId))
          : new Set();

        edges.forEach((edge) => {
          const source = getAnchor(edge.source, edge.target);
          const target = getAnchor(edge.target, edge.source);
          const sourceVisible = nodeMatchesFilter(byId.get(edge.source));
          const targetVisible = nodeMatchesFilter(byId.get(edge.target));
          const isActive = activeEdges.has(edge);
          const isDimmed = Boolean(selectedId && !isActive);
          const isFiltered = !sourceVisible || !targetVisible;
          const path = document.createElementNS(svgNamespace, "path");
          const label = document.createElementNS(svgNamespace, "text");
          let pathData;
          let labelX;
          let labelY;

          if (edge.route === "bottom") {
            const bottomY = surfaceRect.height - 20;
            pathData = `M ${source.x} ${source.y} C ${source.x} ${bottomY}, ${target.x} ${bottomY}, ${target.x} ${target.y}`;
            labelX = (source.x + target.x) / 2;
            labelY = bottomY - 6;
          } else if (Math.abs(target.x - source.x) < 52) {
            const sideX = Math.min(surfaceRect.width - 16, Math.max(source.x, target.x) + 44);
            pathData = `M ${source.x} ${source.y} C ${sideX} ${source.y}, ${sideX} ${target.y}, ${target.x} ${target.y}`;
            labelX = sideX;
            labelY = (source.y + target.y) / 2;
          } else {
            const middleX = (source.x + target.x) / 2;
            pathData = `M ${source.x} ${source.y} C ${middleX} ${source.y}, ${middleX} ${target.y}, ${target.x} ${target.y}`;
            labelX = middleX;
            labelY = (source.y + target.y) / 2 - 4;
          }

          path.setAttribute("d", pathData);
          path.setAttribute("data-kind", edge.kind);
          path.setAttribute(
            "class",
            `graph-edge${isActive ? " is-active" : ""}${isDimmed ? " is-dimmed" : ""}${isFiltered ? " is-filtered" : ""}`
          );
          path.setAttribute("marker-end", isActive ? "url(#arrowActive)" : "url(#arrowNeutral)");

          label.setAttribute("x", String(labelX));
          label.setAttribute("y", String(labelY));
          label.setAttribute("class", `edge-label${isActive && !isFiltered ? " is-active" : ""}`);
          label.textContent = edge.label;

          edgeLayer.append(path, label);
        });
      };

      const renderOverview = () => {
        detailsKicker.textContent = "关系概览";
        detailsTitle.textContent = "实时交易风控";
        detailsStatus.textContent = "运行中";
        detailsStatus.style.setProperty("--tag-color", "var(--primary)");
        detailsStatus.style.setProperty("--tag-bg", "var(--primary-subtle)");
        detailsBody.innerHTML = `
          <p class="summary-line">当前场景围绕一笔夜间大额交易，串联身份、设备、行为、策略、模型与处置对象。</p>
          <dl class="info-list">
            <div class="info-row"><dt>对象数量</dt><dd>15 个</dd></div>
            <div class="info-row"><dt>关系数量</dt><dd>20 条</dd></div>
            <div class="info-row"><dt>高风险对象</dt><dd>2 个</dd></div>
            <div class="info-row"><dt>当前环境</dt><dd>生产环境</dd></div>
          </dl>
          <h2 class="section-title">主要风险链路</h2>
          <div class="overview-path" aria-label="主要风险链路">
            <span class="overview-path-node">交易事件</span>
            ${icon("i-chevron-right")}
            <span class="overview-path-node">风险特征</span>
            ${icon("i-chevron-right")}
            <span class="overview-path-node">欺诈模型</span>
            ${icon("i-chevron-right")}
            <span class="overview-path-node">人工审核</span>
          </div>
          <div class="details-tip">点击画布中的任一对象，可聚焦其直接关系并查看负责方、状态和关联对象。</div>
        `;
      };

      const renderDetails = (node) => {
        const tone = toneMeta[node.tone];
        const directEdges = edges.filter((edge) => edge.source === node.id || edge.target === node.id);
        detailsKicker.textContent = groupMeta[node.group].label;
        detailsTitle.textContent = node.label;
        detailsStatus.textContent = node.status;
        detailsStatus.style.setProperty("--tag-color", tone.text);
        detailsStatus.style.setProperty("--tag-bg", tone.background);

        const relations = directEdges.map((edge) => {
          const isSource = edge.source === node.id;
          const other = byId.get(isSource ? edge.target : edge.source);
          const direction = isSource ? `${edge.label} →` : `← ${edge.label}`;
          return `
            <li class="relation-item">
              <span class="relation-object">${other.label}</span>
              <span class="relation-label">${direction}</span>
            </li>
          `;
        }).join("");

        detailsBody.innerHTML = `
          <p class="summary-line">${node.description}</p>
          <dl class="info-list">
            <div class="info-row"><dt>对象标识</dt><dd>${node.meta}</dd></div>
            <div class="info-row"><dt>负责方</dt><dd>${node.owner}</dd></div>
            <div class="info-row"><dt>直接关系</dt><dd>${directEdges.length} 条</dd></div>
            <div class="info-row"><dt>更新时间</dt><dd>${node.updated}</dd></div>
          </dl>
          <h2 class="section-title">直接关联对象</h2>
          <ul class="relation-list">${relations}</ul>
        `;
      };

      const updateView = () => {
        const related = selectedId ? relatedIds(selectedId) : new Set();
        let visibleNodes = 0;

        nodes.forEach((node) => {
          const element = nodeElements.get(node.id);
          const matches = nodeMatchesFilter(node);
          const isSelected = node.id === selectedId;
          const isRelated = Boolean(selectedId && related.has(node.id));
          const isSearchMatch = Boolean(searchTerm && matches);
          if (matches) visibleNodes += 1;

          element.classList.toggle("is-filtered", !matches);
          element.classList.toggle("is-dimmed", Boolean(selectedId && !isRelated));
          element.classList.toggle("is-related", Boolean(isRelated && !isSelected));
          element.classList.toggle("is-match", isSearchMatch);
          element.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });

        if (selectedId) {
          const selectedNode = byId.get(selectedId);
          renderDetails(selectedNode);
          selectionStatus.textContent = `已选择：${selectedNode.label}`;
        } else {
          renderOverview();
          selectionStatus.textContent = "未选择对象";
        }

        filterInfo.textContent = `${visibleNodes} 个对象 · ${edges.length} 条关系`;
        visibleCount.textContent = `显示 ${visibleNodes} / ${nodes.length} 个对象`;
        drawEdges();
      };

      const setZoom = (nextZoom) => {
        zoom = Math.min(1.2, Math.max(0.8, nextZoom));
        graphSurface.style.transform = `scale(${zoom})`;
        zoomValue.textContent = `${Math.round(zoom * 100)}%`;
      };

      const closeMobileSidebar = () => {
        if (window.innerWidth <= 760) body.classList.remove("sidebar-open");
      };

      const applyTheme = (theme, announce = true) => {
        if (!allowedThemes.has(theme)) return;
        document.documentElement.dataset.theme = theme;
        themeSwitcher.value = theme;
        try {
          window.localStorage.setItem(themeStorageKey, theme);
        } catch {
          /* Theme still applies for the current session. */
        }
        window.requestAnimationFrame(layoutNodes);
        if (announce) showToast(`已切换为 ${themeNames[theme]} 风格`);
      };

      themeSwitcher.value = initialTheme;
      renderNodes();
      renderLanes();
      layoutNodes();
      renderOverview();
      updateView();

      themeSwitcher.addEventListener("change", () => {
        applyTheme(themeSwitcher.value);
      });

      graphSearch.addEventListener("input", () => {
        searchTerm = graphSearch.value.trim().toLowerCase();
        updateView();
      });

      riskFilter.addEventListener("change", () => {
        filterValue = riskFilter.value;
        updateView();
      });

      timeRange.addEventListener("change", () => {
        updatedAt.textContent = formatNow();
        showToast(`已切换到${timeRange.options[timeRange.selectedIndex].text}数据范围`);
      });

      graphViewport.addEventListener("click", (event) => {
        if (!event.target.closest(".graph-node") && selectedId) {
          selectedId = null;
          updateView();
        }
      });

      document.getElementById("zoomInButton").addEventListener("click", () => setZoom(zoom + 0.1));
      document.getElementById("zoomOutButton").addEventListener("click", () => setZoom(zoom - 0.1));
      document.getElementById("fitButton").addEventListener("click", () => setZoom(1));

      document.getElementById("refreshButton").addEventListener("click", () => {
        updatedAt.textContent = formatNow();
        showToast("对象关系数据已刷新");
      });

      document.getElementById("exportButton").addEventListener("click", () => {
        const header = ["来源对象", "关系", "目标对象"];
        const rows = edges.map((edge) => [
          byId.get(edge.source).label,
          edge.label,
          byId.get(edge.target).label
        ]);
        const csv = [header, ...rows]
          .map((row) => row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(","))
          .join("\n");
        const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "risk-object-relations.csv";
        link.click();
        URL.revokeObjectURL(url);
        showToast("关系数据已导出");
      });

      document.getElementById("sidebarToggle").addEventListener("click", () => {
        if (window.innerWidth <= 760) {
          body.classList.toggle("sidebar-open");
        } else {
          body.classList.toggle("sidebar-collapsed");
        }
        window.setTimeout(layoutNodes, 220);
      });

      document.querySelectorAll("[data-demo-nav]").forEach((item) => {
        item.addEventListener("click", () => {
          showToast(`${item.dataset.demoNav}为系统框架演示入口`);
          closeMobileSidebar();
        });
      });

      document.getElementById("notificationButton").addEventListener("click", () => {
        showToast("当前有 3 条待处理风险通知");
      });

      document.getElementById("helpButton").addEventListener("click", () => {
        showToast("点击节点聚焦关系，点击画布空白处返回全图");
      });

      userTrigger.addEventListener("click", () => {
        const willOpen = userMenu.hidden;
        userMenu.hidden = !willOpen;
        userTrigger.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });

      document.querySelectorAll("[data-user-action]").forEach((item) => {
        item.addEventListener("click", () => {
          showToast(`${item.dataset.userAction}为演示操作`);
          userMenu.hidden = true;
          userTrigger.setAttribute("aria-expanded", "false");
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".user-area")) {
          userMenu.hidden = true;
          userTrigger.setAttribute("aria-expanded", "false");
        }
        if (
          window.innerWidth <= 760 &&
          body.classList.contains("sidebar-open") &&
          !event.target.closest(".sidebar") &&
          !event.target.closest("#sidebarToggle")
        ) {
          body.classList.remove("sidebar-open");
        }
      });

      const resizeObserver = new ResizeObserver(() => {
        window.cancelAnimationFrame(resizeFrame);
        resizeFrame = window.requestAnimationFrame(layoutNodes);
      });
      resizeObserver.observe(graphSurface);
    })();
  </script>
</body>
</html>
